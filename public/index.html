<!DOCTYPE html>
<html>

        <link rel="stylesheet" href="./styles.css" />

        <title>figment crocs</title>

    <body>
        <div id="page-stats">
            <p>figment crocs</p>
            <p>total visitors: <span id="total-visitors"></span></p>
            <p>visitors today: <span id="visitors-today"></span></p>
            <p id="bomb-count-cont" style="color: white">times blown up: <span id="bomb-count"></span></p>
        </div>
        <div id="img-cont">
            <img src="https://u-mercari-images.mercdn.net/photos/m74649345082_3.jpg?1762219564" />

            <img class="hidden" src="https://u-mercari-images.mercdn.net/thumb/photos/m97275278859_1.jpg?width=2560&quality=75&_=1762371707" />

            <source src="./soundLibrary/soundBoom.mp3" />
        </audio>
        <div id="main-btns">
            <button id="zoom">ZOOM!</button>
            <button id="spin">SPIN!
                <audio id="spinSound">
                    <source src="./soundLibrary/soundSpin.mp3" type="audio/mpeg" />
                </audio>
            </button>
            <button id="pulsate">PULSATE!
                <audio id="pulsateSound">
                    <source type="audio/mpeg" />

            </button>
            <button id="mystery">???</button>

                <audio id="randomizeSound">
                    <source src="./soundLibrary/sound0.mp3" type="audio/mpeg" />

            <button id="explosion">BLOW UP
                <audio id="bombSound">
                    <source src="./explosion.mp3" type="audio/mpeg" />
                </audio>
            </button>
        </div>
        <div class="hidden" id="celebration">

            <div>
